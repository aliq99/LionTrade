name: DB Migrate
on:
  push:
    branches: [ main ]
    paths:
      - "supabase/migrations/**.sql"
  workflow_dispatch:
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Ensure DNS tools
        run: sudo apt-get update && sudo apt-get install -y dnsutils
      - name: Apply Supabase migrations (IPv4 if available)
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          URL="$SUPABASE_DB_URL"
          HOST=$(printf '%s\n' "$URL" | sed -E 's#.*@([^:/?]+).*#\1#')

          # Try to resolve IPv4 (non-fatal)
          IPV4=$(
            getent ahostsv4 "$HOST" | awk '{print $1}' | head -n1 ||
            getent hosts "$HOST" | awk '{print $1}' | grep -m1 -Eo '([0-9]{1,3}\.){3}[0-9]{1,3}' ||
            (command -v dig >/dev/null && dig +short A "$HOST" | head -n1) ||
            (command -v nslookup >/dev/null && nslookup -type=A "$HOST" 2>/dev/null | awk '/^Address: /{print $2; exit}')
          )

          if [ -n "${IPV4:-}" ]; then
            export PGHOSTADDR="$IPV4"
            echo "Using IPv4 $PGHOSTADDR for $HOST"
          else
            echo "::warning::No IPv4 for $HOST; proceeding without PGHOSTADDR (IPv6/normal DNS)."
          fi

          PGCONNECT_TIMEOUT=20 npx --yes supabase -y db push --db-url "$URL"
