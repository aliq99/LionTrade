- name: Apply Supabase migrations (IPv4 if available)
  shell: bash
  env:
    SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    SUPABASE_DB_URL_IPV4: ${{ secrets.SUPABASE_DB_URL_IPV4 }}
  run: |
    set -euo pipefail
    URL="${SUPABASE_DB_URL_IPV4:-$SUPABASE_DB_URL}"   # prefer IPv4 DSN if provided
    if [ -n "${SUPABASE_DB_URL_IPV4:-}" ]; then
      echo "Using SUPABASE_DB_URL_IPV4"
    else
      echo "Using SUPABASE_DB_URL"
    fi
    HOST=$(printf '%s\n' "$URL" | sed -E 's#.*@([^:/?]+).*#\1#')
    IPV4=$(dig +short A "$HOST" @1.1.1.1 | head -n1 || true)
    if [ -n "${IPV4:-}" ]; then
      export PGHOSTADDR="$IPV4"
      echo "IPv4: $PGHOSTADDR"
    else
      echo "::warning::No IPv4 for $HOST; proceeding without PGHOSTADDR (will use IPv6 if present)."
    fi
    supabase --version
    PGCONNECT_TIMEOUT=30 supabase migrations apply --db-url "$URL"
